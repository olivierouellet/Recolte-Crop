name: Bogue · Bug report
description: Quelque chose ne fonctionne pas comme prévu. · Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Écrivez en français ou en anglais. · Write in French or English.

        Si le problème touche la sécurité, fermez ce formulaire et suivez plutôt
        [SECURITY.md](https://github.com/olivierouellet/Recolte-Crop/blob/main/SECURITY.md).
        · If the bug has a security side, close this and use SECURITY.md instead.

        N’indiquez pas l’adresse ou les coordonnées exactes de votre ferme; la province suffit.
        · Don't post your farm's exact address or coordinates; the province is enough.

  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui s’est passé · What happened
      description: Ce que vous avez fait, ce que vous avez vu, et ce que vous attendiez. · What you did, what you saw, and what you expected.
    validations:
      required: true

  - type: input
    id: products
    attributes:
      label: Produits concernés · Products involved
      description: Par exemple ch_gs, ac_07. · For example ch_gs, ac_07.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Versions
      description: Récolte et Home Assistant. · Récolte and Home Assistant.
      placeholder: Récolte 0.1.0, Home Assistant 2026.10.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Journaux · Logs
      description: >
        Paramètres → Système → Journaux, filtrés sur « recolte ». ·
        Settings → System → Logs, filtered on "recolte".
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Avant d’envoyer · Before submitting
      options:
        - label: Ce n’est pas un problème de sécurité. · This is not a security issue.
          required: true
